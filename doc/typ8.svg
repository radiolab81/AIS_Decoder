<svg xmlns='http://www.w3.org/2000/svg' width='900' height='138' viewBox='0 0 900 138' font-family='Helvetica,Arial,sans-serif'><rect width='900' height='138' fill='#ffffff'/><text x='20' y='28' font-size='16' font-weight='bold' fill='#1f2937'>Typ 8 - Binaer-Broadcast</text><text x='20' y='46' font-size='12' fill='#6b7280'>DAC = Landeskennung der Anwendung, FI = Funktionskennung, danach Anwendungsdaten (bis 952 Bit)</text><rect x='20' y='62' width='72' height='52' rx='5' fill='#dbeafe' stroke='#9ca3af'/><text x='56.0' y='82.0' font-size='11' text-anchor='middle' fill='#1f2937'>Typ</text><text x='56.0' y='98.0' font-size='9' text-anchor='middle' fill='#6b7280'>6 Bit  (0)</text><rect x='95' y='62' width='72' height='52' rx='5' fill='#dcfce7' stroke='#9ca3af'/><text x='131.0' y='82.0' font-size='11' text-anchor='middle' fill='#1f2937'>Repeat</text><text x='131.0' y='98.0' font-size='9' text-anchor='middle' fill='#6b7280'>2 Bit  (6)</text><rect x='170' y='62' width='80.0' height='52' rx='5' fill='#fef3c7' stroke='#9ca3af'/><text x='210.0' y='82.0' font-size='11' text-anchor='middle' fill='#1f2937'>MMSI</text><text x='210.0' y='98.0' font-size='9' text-anchor='middle' fill='#6b7280'>30 Bit  (8)</text><rect x='253.0' y='62' width='72' height='52' rx='5' fill='#fce7f3' stroke='#9ca3af'/><text x='289.0' y='82.0' font-size='11' text-anchor='middle' fill='#1f2937'>-</text><text x='289.0' y='98.0' font-size='9' text-anchor='middle' fill='#6b7280'>2 Bit  (38)</text><rect x='328.0' y='62' width='72' height='52' rx='5' fill='#e5e7eb' stroke='#9ca3af'/><text x='364.0' y='82.0' font-size='11' text-anchor='middle' fill='#1f2937'>DAC</text><text x='364.0' y='98.0' font-size='9' text-anchor='middle' fill='#6b7280'>10 Bit  (40)</text><rect x='403.0' y='62' width='72' height='52' rx='5' fill='#dbeafe' stroke='#9ca3af'/><text x='439.0' y='82.0' font-size='11' text-anchor='middle' fill='#1f2937'>FI</text><text x='439.0' y='98.0' font-size='9' text-anchor='middle' fill='#6b7280'>6 Bit  (50)</text><rect x='478.0' y='62' width='278.0' height='52' rx='5' fill='#dcfce7' stroke='#9ca3af'/><text x='617.0' y='82.0' font-size='11' text-anchor='middle' fill='#1f2937'>Anwendungsdaten</text><text x='617.0' y='98.0' font-size='9' text-anchor='middle' fill='#6b7280'>120 Bit  (56)</text><text x='20' y='132' font-size='11' fill='#6b7280'>Klammer = Bitposition im Nachrichtenfeld (MSB zuerst, Bit 0 = erstes Bit des Typs), zusammen 176 Bit.</text></svg>
