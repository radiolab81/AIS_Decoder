<svg xmlns='http://www.w3.org/2000/svg' width='900' height='283' viewBox='0 0 900 283' font-family='Helvetica,Arial,sans-serif'><rect width='900' height='283' fill='#ffffff'/><text x='20' y='28' font-size='16' font-weight='bold' fill='#1f2937'>Signalkette: vom Funksignal zum NMEA-Satz</text><rect x='20' y='50' width='190' height='52' rx='5' fill='#e5e7eb' stroke='#9ca3af'/><text x='115.0' y='70.0' font-size='13' text-anchor='middle' fill='#1f2937'>Antenne</text><text x='115.0' y='86.0' font-size='11' text-anchor='middle' fill='#6b7280'>161,975 / 162,025 MHz</text><line x1='210' y1='76' x2='235' y2='76' stroke='#6b7280' stroke-width='1.5'/><polygon points='235,76 228,72 228,80' fill='#6b7280'/><rect x='235' y='50' width='190' height='52' rx='5' fill='#dbeafe' stroke='#9ca3af'/><text x='330.0' y='70.0' font-size='13' text-anchor='middle' fill='#1f2937'>NFM-Scanner</text><text x='330.0' y='86.0' font-size='11' text-anchor='middle' fill='#6b7280'>FM-Diskriminator</text><line x1='425' y1='76' x2='450' y2='76' stroke='#6b7280' stroke-width='1.5'/><polygon points='450,76 443,72 443,80' fill='#6b7280'/><rect x='450' y='50' width='190' height='52' rx='5' fill='#dbeafe' stroke='#9ca3af'/><text x='545.0' y='70.0' font-size='13' text-anchor='middle' fill='#1f2937'>ADC 10 Bit</text><text x='545.0' y='86.0' font-size='11' text-anchor='middle' fill='#6b7280'>38,4 kHz = 4 x 9600</text><line x1='640' y1='76' x2='665' y2='76' stroke='#6b7280' stroke-width='1.5'/><polygon points='665,76 658,72 658,80' fill='#6b7280'/><rect x='665' y='50' width='190' height='52' rx='5' fill='#dcfce7' stroke='#9ca3af'/><text x='760.0' y='70.0' font-size='13' text-anchor='middle' fill='#1f2937'>Integrate &amp; Dump</text><text x='760.0' y='86.0' font-size='11' text-anchor='middle' fill='#6b7280'>Summe ueber 1 Bit</text><path d='M760,102 V130 H115 V150' fill='none' stroke='#6b7280' stroke-width='1.5'/><polygon points='115,158 110,150 120,150' fill='#6b7280'/><rect x='20' y='158' width='160' height='52' rx='5' fill='#dcfce7' stroke='#9ca3af'/><text x='100.0' y='178.0' font-size='12' text-anchor='middle' fill='#1f2937'>Schwelle</text><text x='100.0' y='194.0' font-size='10' text-anchor='middle' fill='#6b7280'>Hi/Lo-Tracker je Phase</text><line x1='180' y1='184' x2='192' y2='184' stroke='#6b7280' stroke-width='1.5'/><polygon points='192,184 185,180 185,188' fill='#6b7280'/><rect x='192' y='158' width='160' height='52' rx='5' fill='#dcfce7' stroke='#9ca3af'/><text x='272.0' y='178.0' font-size='12' text-anchor='middle' fill='#1f2937'>NRZI + Flag 0x7E</text><text x='272.0' y='194.0' font-size='10' text-anchor='middle' fill='#6b7280'>Entstopfen, 4 Bitphasen</text><line x1='352' y1='184' x2='364' y2='184' stroke='#6b7280' stroke-width='1.5'/><polygon points='364,184 357,180 357,188' fill='#6b7280'/><rect x='364' y='158' width='160' height='52' rx='5' fill='#fef3c7' stroke='#9ca3af'/><text x='444.0' y='178.0' font-size='12' text-anchor='middle' fill='#1f2937'>Rahmenpuffer</text><text x='444.0' y='194.0' font-size='10' text-anchor='middle' fill='#6b7280'>Warteschlange</text><line x1='524' y1='184' x2='536' y2='184' stroke='#6b7280' stroke-width='1.5'/><polygon points='536,184 529,180 529,188' fill='#6b7280'/><rect x='536' y='158' width='160' height='52' rx='5' fill='#fef3c7' stroke='#9ca3af'/><text x='616.0' y='178.0' font-size='12' text-anchor='middle' fill='#1f2937'>CRC-16 + Typ/Laenge</text><text x='616.0' y='194.0' font-size='10' text-anchor='middle' fill='#6b7280'>Hauptschleife</text><line x1='696' y1='184' x2='708' y2='184' stroke='#6b7280' stroke-width='1.5'/><polygon points='708,184 701,180 701,188' fill='#6b7280'/><rect x='708' y='158' width='160' height='52' rx='5' fill='#fce7f3' stroke='#9ca3af'/><text x='788.0' y='178.0' font-size='12' text-anchor='middle' fill='#1f2937'>!AIVDM / Klartext</text><text x='788.0' y='194.0' font-size='10' text-anchor='middle' fill='#6b7280'>UART 38400</text><text x='20' y='244' font-size='12' fill='#6b7280'>Blau: Analog/Abtastung - Gruen: Bitdemodulation (ais_dsp.c, in der Interruptroutine) - Gelb: Rahmenpruefung (ais_msg.c) - Rosa: Ausgabe (ais_app.c)</text><text x='20' y='264' font-size='12' fill='#6b7280'>Kein I/Q, keine Traegernachfuehrung: der Scanner liefert bereits die demodulierte Datenfolge.</text></svg>
