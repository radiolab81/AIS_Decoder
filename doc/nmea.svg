<svg xmlns='http://www.w3.org/2000/svg' width='900' height='284' viewBox='0 0 900 284' font-family='Helvetica,Arial,sans-serif'><rect width='900' height='284' fill='#ffffff'/><text x='20' y='28' font-size='16' font-weight='bold' fill='#1f2937'>Von den Bits zum NMEA-Satz</text><text x='20' y='70' font-size='15' font-family='monospace' fill='#1f2937'>!AIVDM,1,1,,A,15MqDMPP00GRo;RCDf`@0?vT0@;W,0*74</text><text x='40' y='100' font-size='13' font-family='monospace' fill='#2563eb'>!AIVDM</text><text x='200' y='100' font-size='13' fill='#1f2937'>Sprecher AI, Satzformat VDM (Daten von anderen Schiffen)</text><text x='40' y='122' font-size='13' font-family='monospace' fill='#2563eb'>1,1</text><text x='200' y='122' font-size='13' fill='#1f2937'>Satz 1 von 1 (lange Nachrichten: 2 oder 3 Saetze, je max. 60 Zeichen)</text><text x='40' y='144' font-size='13' font-family='monospace' fill='#2563eb'>(leer)</text><text x='200' y='144' font-size='13' fill='#1f2937'>Sequenz-ID 0..9, nur bei Mehrteilern gesetzt</text><text x='40' y='166' font-size='13' font-family='monospace' fill='#2563eb'>A</text><text x='200' y='166' font-size='13' fill='#1f2937'>Funkkanal: A = 161,975 MHz, B = 162,025 MHz</text><text x='40' y='188' font-size='13' font-family='monospace' fill='#2563eb'>15Mq...0@;W</text><text x='200' y='188' font-size='13' fill='#1f2937'>Nutzdaten: je 6 Bit -&gt; 1 ASCII-Zeichen (Wert + 48, ab 40 weitere +8)</text><text x='40' y='210' font-size='13' font-family='monospace' fill='#2563eb'>0</text><text x='200' y='210' font-size='13' fill='#1f2937'>Fuellbits, damit die Bitzahl durch 6 teilbar wird</text><text x='40' y='232' font-size='13' font-family='monospace' fill='#2563eb'>*74</text><text x='200' y='232' font-size='13' fill='#1f2937'>Pruefsumme: XOR aller Zeichen zwischen ! und *</text><text x='20' y='266' font-size='13' fill='#1f2937'>Zeichen -> Bits:  '1' = 49 - 48 = 1 = 000001 (Typ 1),  '5' = 53 - 48 = 5 = 000101 (Repeat 0 + 3 Bit MMSI)  usw.</text></svg>
